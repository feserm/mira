# Daily base backup at 02:00 (cron with six fields, seconds first). WAL is archived continuously by
# the plugin, so this only bounds how much WAL a restore has to replay.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mira-pg-daily
spec:
  schedule: '0 0 2 * * *'
  immediate: true
  backupOwnerReference: self
  cluster:
    name: mira-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: prefer-standby
