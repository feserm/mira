{{- if .Values.migration.enabled }}
{{- $dbSecret := .Values.migration.databaseSecret }}
{{- if not $dbSecret.name }}{{ $dbSecret = .Values.secrets.database }}{{ end }}
# Runs BEFORE the chart's other resources exist (pre-install) or are updated (pre-upgrade).
# It therefore references only things that must already exist: the Secret and the ServiceAccount.
# The ConfigMap is deliberately not used; the Job needs only DATABASE_URL (and DB_SSL, and the CA
# Secret when config.db.caSecret is set: it must exist beforehand, like the database Secret).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mira.fullname" . }}-migrate
  labels:
    {{- include "mira.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "mira.migrateSelectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ default "default" .Values.migration.serviceAccountName }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "mira.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "migrate.js"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                {{- include "mira.secretKeyRef" (dict "ref" $dbSecret "path" "migration.databaseSecret") | nindent 16 }}
            {{- with .Values.config.db.ssl }}
            - name: DB_SSL
              value: {{ . | quote }}
            {{- end }}
            {{- include "mira.dbCaEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          {{- if .Values.config.db.caSecret.name }}
          volumeMounts:
            {{- include "mira.dbCaVolumeMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.config.db.caSecret.name }}
      volumes:
        {{- include "mira.dbCaVolume" . | nindent 8 }}
      {{- end }}
{{- end }}
