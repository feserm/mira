name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Registry credentials come from the workflow token (GHCR). To push elsewhere, set the repository
  # variable IMAGE_NAME and the secrets REGISTRY, REGISTRY_USERNAME and REGISTRY_PASSWORD.
  REGISTRY: ${{ secrets.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}

jobs:
  verify:
    name: Check, lint, test, build
    runs-on: ubuntu-latest
    # The queue, runner, Load, pipeline and BrAPI handler tests need a real Postgres. They create and
    # drop their own throwaway database and roles on this server (src/lib/server/test-support/dml-db.ts).
    # The user needs CREATEDB and CREATEROLE (the service's superuser has both). CI is set by Actions, so
    # test-support/ci-guard.test.ts fails the run if TEST_DATABASE_URL ever goes missing instead of letting
    # those suites skip silently.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      # TODO: add the client project (`pnpm exec playwright install --with-deps chromium`, then
      # `pnpm vitest run --project client`) once the repo has any *.svelte.test.ts files.
      - run: pnpm vitest run --project server
      # Needs no env vars; this also proves the build works in a clean environment.
      - run: pnpm build
      - run: pnpm build:migrate
      - run: pnpm build:worker
      - run: pnpm build:retention

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Production dependency tree only; fails on high or critical advisories.
      - run: pnpm audit --prod --audit-level high

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/mira
      KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.6.7
      PROMTOOL_IMAGE: prom/prometheus:v2.55.1
      YQ_IMAGE: mikefarah/yq:4.44.3
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint and render every example value set
        run: |
          set -eu
          for extra in "" ci/single-replica-values.yaml ci/no-ingress-values.yaml \
            ci/worker-disabled-values.yaml ci/worker-scaled-values.yaml ci/cnpg-values.yaml \
            ci/monitoring-values.yaml ci/network-policy-values.yaml ci/network-policy-cilium-values.yaml \
            ci/network-policy-https-values.yaml ci/rate-limit-values.yaml; do
            set --
            [ -z "$extra" ] || set -- -f "$CHART/$extra"
            helm lint "$CHART" -f "$CHART/ci/default-values.yaml" "$@"
            # ServiceMonitor, PrometheusRule and CiliumNetworkPolicy are CRDs: no schema here, and they are
            # only rendered by ci/monitoring-values.yaml and ci/network-policy-cilium-values.yaml (off by default).
            helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" "$@" \
              | docker run --rm -i "$KUBECONFORM_IMAGE" -strict -summary \
                  -skip ServiceMonitor,PrometheusRule,CiliumNetworkPolicy -
          done
      - name: Monitoring and retention flags
        run: |
          set -eu
          render() { helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" "$@"; }
          # Off by default: a cluster without the Prometheus operator installs without its CRDs.
          if render | grep -E '^kind: (ServiceMonitor|PrometheusRule)$'; then
            echo "monitoring objects rendered by default"; exit 1
          fi
          render | grep -q '^kind: CronJob$'
          # On: both objects, the rules include the Postgres alerts from the runbook, and only the web
          # pods get the metrics token.
          render -f "$CHART/ci/monitoring-values.yaml" > monitoring.yaml
          grep -q '^kind: ServiceMonitor$' monitoring.yaml
          grep -q '^kind: PrometheusRule$' monitoring.yaml
          grep -q 'alert: MiraPostgresBackupFailed' monitoring.yaml
          grep -q 'alert: MiraPostgresArchivingFailing' monitoring.yaml
          grep -q 'alert: MiraPostgresConnectionsHigh' monitoring.yaml
          test "$(grep -c 'name: METRICS_TOKEN' monitoring.yaml)" = 1
          # Retention off removes the CronJob and its alert.
          render -f "$CHART/ci/monitoring-values.yaml" --set retention.enabled=false > no-retention.yaml
          if grep -qE '^kind: CronJob$|MiraRetentionNotRunning' no-retention.yaml; then
            echo "retention.enabled=false still renders the CronJob or its alert"; exit 1
          fi
      - name: Security settings reach the ConfigMap
        run: |
          set -eu
          helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" --show-only templates/configmap.yaml > cm.yaml
          grep -q 'CSP_MODE: "report-only"' cm.yaml
          grep -q 'HSTS_MAX_AGE: "15552000"' cm.yaml
          helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" --show-only templates/configmap.yaml \
            --set security.csp.mode=enforce --set security.hsts.maxAge=0 > cm.yaml
          grep -q 'CSP_MODE: "enforce"' cm.yaml
          grep -q 'HSTS_MAX_AGE: "0"' cm.yaml
      - name: Ingress rate limit annotations
        run: |
          set -eu
          if helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" --show-only templates/ingress.yaml | grep -q 'limit-'; then
            echo "the ingress is rate limited by default"; exit 1
          fi
          helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" -f "$CHART/ci/rate-limit-values.yaml" \
            --show-only templates/ingress.yaml > ingress.yaml
          grep -q 'nginx.ingress.kubernetes.io/limit-rps: "20"' ingress.yaml
          grep -q 'nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"' ingress.yaml
          grep -q 'nginx.ingress.kubernetes.io/limit-connections: "40"' ingress.yaml
          grep -q 'nginx.ingress.kubernetes.io/limit-whitelist: 192.0.2.0/24,198.51.100.7/32' ingress.yaml
          # the user's own annotations stay
          grep -q 'cert-manager.io/cluster-issuer: letsencrypt' ingress.yaml
      - name: Pod Security restricted and network policies, per pod kind
        run: |
          set -eu
          # shellcheck disable=SC2086 # $flags is a word list on purpose
          check() { # the flags of check-rendered.mjs, then the extra helm arguments after --
            flags=""
            while [ "$1" != -- ]; do flags="$flags $1"; shift; done; shift
            helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" "$@" \
              | docker run --rm -i "$YQ_IMAGE" -o=json -I=0 ea '[.]' - \
              | node "$CHART/ci/check-rendered.mjs" $flags
          }
          # Off by default: no policy objects. Every pod kind meets the restricted profile either way.
          check --
          check --policies -- -f "$CHART/ci/network-policy-values.yaml"
          check --policies --mode cilium -- -f "$CHART/ci/network-policy-cilium-values.yaml"
          check --policies --mode https --pg-port 6432 --issuer-port 8443 --extra-port=3128 -- \
            -f "$CHART/ci/network-policy-https-values.yaml"
          # The checker must be able to fail: each of these has to be refused.
          for bad in "podSecurityContext.runAsNonRoot=false" "securityContext.allowPrivilegeEscalation=true" \
            "securityContext.readOnlyRootFilesystem=false" "podSecurityContext.seccompProfile.type=Unconfined"; do
            if check -- --set "$bad" 2> err.log; then echo "check-rendered accepted $bad"; exit 1; fi
          done
          if check --policies -- -f "$CHART/ci/network-policy-values.yaml" \
            --set 'networkPolicy.extraEgress[0].to[0].ipBlock.cidr=10.1.1.1/32' \
            --set 'networkPolicy.extraEgress[0].ports[0].port=8080' 2> err.log; then
            echo "check-rendered accepted an extra egress port"; exit 1
          fi
      - name: Alert rules pass promtool
        run: |
          set -eu
          mkdir promtool
          helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" -f "$CHART/ci/monitoring-values.yaml" \
            --show-only templates/prometheusrule.yaml \
            | docker run --rm -i "$YQ_IMAGE" '{"groups": .spec.groups}' > promtool/rules.yaml
          cp "$CHART/ci/rules-test.yaml" promtool/test.yaml
          tar c -C promtool rules.yaml test.yaml | docker run --rm -i --entrypoint sh "$PROMTOOL_IMAGE" -c \
            'mkdir /tmp/w && tar x -C /tmp/w && cd /tmp/w && promtool check rules rules.yaml && promtool test rules test.yaml'
      - name: Incomplete values must be rejected
        run: |
          set -eu
          if helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" --set image.tag= 2> err.log; then
            echo "expected a failure without image.tag"; exit 1
          fi
          grep -q "image.tag" err.log
          if helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" --set secrets.database.name= 2> err.log; then
            echo "expected a failure without a database secret"; exit 1
          fi
          grep -q "secrets.database.name" err.log
          if helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" --set worker.leaseSeconds=5 2> err.log; then
            echo "expected a failure for worker.leaseSeconds=5"; exit 1
          fi
          grep -q "worker.leaseSeconds" err.log
          if helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" --set config.db.ssl=maybe 2> err.log; then
            echo "expected a failure for config.db.ssl=maybe"; exit 1
          fi
          grep -q "config.db.ssl" err.log
          if helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" --set monitoring.serviceMonitor.enabled=true 2> err.log; then
            echo "expected a failure for a ServiceMonitor without a metrics token Secret"; exit 1
          fi
          grep -q "secrets.metricsToken.name" err.log
          if helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" --set retention.days=10 2> err.log; then
            echo "expected a failure for retention.days=10"; exit 1
          fi
          grep -q "retention.days" err.log
          if helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" --set security.csp.mode=strict 2> err.log; then
            echo "expected a failure for an unknown CSP mode"; exit 1
          fi
          grep -q "security.csp.mode" err.log
          # NetworkPolicies need addresses for PLANTdataHUB in cidr mode: no guessing, no silent default.
          if helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" --set networkPolicy.enabled=true 2> err.log; then
            echo "expected a failure for network policies without PLANTdataHUB addresses"; exit 1
          fi
          grep -q "networkPolicy.egress.plantdatahub.cidrs" err.log
          if helm template ci "$CHART" -f "$CHART/ci/default-values.yaml" --set networkPolicy.egress.mode=fqdn 2> err.log; then
            echo "expected a failure for an unknown egress mode"; exit 1
          fi
          grep -q "networkPolicy.egress.mode" err.log

  postgres:
    name: Postgres manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Renders deploy/postgres and validates it against the CRDs of the pinned CloudNativePG and plugin versions.
      - run: deploy/postgres/validate.sh

  image:
    name: Image build, scan and push
    needs: [verify, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Compute image name
        id: image
        # Registry paths must be lowercase
        run: echo "ref=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eu
          image='${{ steps.image.outputs.ref }}'
          test "$(docker run --rm --entrypoint id "$image" -u)" != 0
          # Required config missing: must exit 1 with one clear error
          if docker run --rm --read-only "$image" > startup.log 2>&1; then
            echo "expected a config error with no env"; exit 1
          fi
          grep -q "Invalid server configuration" startup.log
          # Valid config (dummy values): /healthz needs no database
          docker run -d --name smoke --read-only -p 3000:3000 \
            -e DATABASE_URL=postgres://user:pass@127.0.0.1:5432/db \
            -e ORIGIN=https://mira.example.org \
            -e BETTER_AUTH_SECRET=0123456789abcdef0123456789abcdef \
            -e OIDC_ISSUER_URL=https://git.example.org \
            -e OIDC_CLIENT_ID=ci \
            "$image"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/healthz && break
            sleep 1
            test "$i" -lt 30 || { docker logs smoke; exit 1; }
          done
          docker stop smoke
          test "$(docker inspect smoke --format '{{.State.ExitCode}}')" = 0

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH,CRITICAL
          # Fail only on vulnerabilities that have a fix available; unfixed OS-package CVEs in the
          # base image would otherwise keep the pipeline red until Debian ships a patch.
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      # Pushes exactly the image that was smoke-tested and scanned. Tagged by commit SHA only: no
      # `latest`, because a moving tag invites unpinned deployments and makes rollbacks ambiguous.
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push '${{ steps.image.outputs.ref }}'
